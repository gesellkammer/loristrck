name: Test

on: [push, pull_request]

jobs:
  test:
    name: Test on ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev libsndfile1

      - name: Install system deps (macos)
        if: runner.os == 'macOS'
        run: brew install fftw libsndfile

      - name: Prepare Windows build deps
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch fftw (windows)
        if: runner.os == 'Windows'
        run: python scripts/prepare_windows_build.py

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install sndfileio

      - name: Run pytest (pure-python regressions)
        run: python -m pytest test/test_util.py -v

      - name: Run stretch demo (needs compiled ext)
        run: |
          cd test
          python ./test-stretch.py --outfile "test-stretch-${{ matrix.os }}-${{ matrix.python-version }}.wav"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts-${{ matrix.os }}-${{ matrix.python-version }}
          path: test/testout/*
